docker: 
  - name: redis-local
    download: "docker run -d --name redis-local -p 6379:6379 redis"
    run: "docker start redis-local"
    ports: [6379]

  - name: s3-local
    download: 'docker run -d --name s3-local -p 9000:9000 -p 9001:9001 -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio123 -v "{download_path}/minio-data:/data" quay.io/minio/minio server /data --console-address ":9001"'
    run: docker start s3-local
    ports: [9000, 9001]

  - name: mongo-local
    download: "docker run -d --name mongo-local -p 27017:27017 mongo:latest"
    run: docker start mongo-local
    ports: [27017]